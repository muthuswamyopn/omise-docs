openapi: 3.0.3
info:
  title: Omise API
  version: '2014-07-27'
  description: |
    The Omise API enables you to create and manage payment transactions.

    **API Version:** Aegaeon (2014-07-27)

    ## Authentication
    Use HTTP Basic Auth with your secret key as the username and an empty password.

servers:
  - url: https://api.omise.co

security:
  - secretKey: []

tags:
  - name: Charges
    description: Create, capture, and manage payment charges
  - name: Balance
    description: Retrieve your account balance
  - name: Account
    description: Retrieve and update your account configuration
  - name: Capability
    description: Retrieve available payment methods and account limits

paths:
  /account:
    get:
      summary: Retrieve account
      description: Retrieve the current account information.
      operationId: getAccount
      tags: [Account]
      responses:
        '200':
          description: Account information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/AuthenticationFailure'
    patch:
      summary: Update account
      description: Update account configuration settings.
      operationId: updateAccount
      tags: [Account]
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailure'

  /balance:
    get:
      summary: Retrieve balance
      description: |
        Retrieve the current balance of your Omise account.

        This is a READ-ONLY endpoint. The balance includes:
        - **total** - Total balance after fees deducted
        - **available** - Amount you can transfer to your bank right now
        - **reserve_amount** - Funds held by Omise as security buffer
        - **on_hold** - Funds held for pending disputes/reviews

        NOTE: In newer API versions (Deimos), `available` is renamed to `transferable`
        and `reserve_amount` is renamed to `reserve`.
      operationId: getBalance
      tags: [Balance]
      responses:
        '200':
          description: Current balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '401':
          $ref: '#/components/responses/AuthenticationFailure'

  /capability:
    get:
      summary: Retrieve capability
      description: |
        Retrieve available payment methods, limits, and features for your account.

        **Authentication:** Accepts both public keys (pkey_...) and secret keys (skey_...).
        Public key is recommended for client-side usage.

        **Note:** This version uses `payment_backends` instead of `payment_methods`
        and does not include the `country` field. See Deimos for newer format.
      operationId: getCapability
      tags: [Capability]
      security:
        - publicKey: []
        - secretKey: []
      responses:
        '200':
          description: Account capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capability'
        '401':
          $ref: '#/components/responses/AuthenticationFailure'

  /charges:
    post:
      summary: Create a charge
      description: |
        Create a new charge to collect payment from a customer.

        You can charge using:
        - A **card token** (one-time use, from Omise.js)
        - A **customer ID** (charges their default card)
        - An **offsite** payment method (internet banking)
      operationId: createCharge
      tags: [Charges]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateChargeRequest'
      responses:
        '200':
          description: Charge created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          $ref: '#/components/responses/InvalidCharge'
        '401':
          $ref: '#/components/responses/AuthenticationFailure'

    get:
      summary: List all charges
      operationId: listCharges
      tags: [Charges]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of charges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeList'

  /charges/{id}:
    get:
      summary: Retrieve a charge
      operationId: getCharge
      tags: [Charges]
      parameters:
        - $ref: '#/components/parameters/ChargeId'
      responses:
        '200':
          description: Charge details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update a charge
      operationId: updateCharge
      tags: [Charges]
      parameters:
        - $ref: '#/components/parameters/ChargeId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                metadata:
                  type: object
      responses:
        '200':
          description: Charge updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'

  /charges/{id}/capture:
    post:
      summary: Capture a charge
      description: Capture a previously authorized charge.
      operationId: captureCharge
      tags: [Charges]
      parameters:
        - $ref: '#/components/parameters/ChargeId'
      responses:
        '200':
          description: Charge captured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          $ref: '#/components/responses/FailedCapture'

  /charges/{id}/reverse:
    post:
      summary: Reverse a charge
      description: Reverse (void) an authorized but uncaptured charge.
      operationId: reverseCharge
      tags: [Charges]
      parameters:
        - $ref: '#/components/parameters/ChargeId'
      responses:
        '200':
          description: Charge reversed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          $ref: '#/components/responses/FailedReverse'

components:
  securitySchemes:
    secretKey:
      type: http
      scheme: basic
      description: Secret key (skey_...) - use as username with empty password
    publicKey:
      type: http
      scheme: basic
      description: Public key (pkey_...) - use as username with empty password. Safe for client-side.

  parameters:
    ChargeId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^chrg_(test_)?[a-z0-9]+$

  schemas:
    CreateChargeRequest:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          minimum: 1
          description: Amount in smallest currency unit
        currency:
          type: string
          enum: [thb, jpy, usd, eur, gbp, sgd]
        card:
          type: string
          description: Card token from Omise.js
        customer:
          type: string
          description: Customer ID
        capture:
          type: boolean
          default: true
        return_uri:
          type: string
          format: uri
        description:
          type: string
        metadata:
          type: object
        ip:
          type: string
        offsite:
          type: string
          enum: [internet_banking_bay, internet_banking_bbl, internet_banking_ktb, internet_banking_scb]
          description: Offsite payment method for internet banking

    Charge:
      type: object
      description: |
        Charge object returned in API responses.

        HOW TO CHECK CAPTURE STATUS (Aegaeon):
        - Use `captured` boolean field (true/false)
        - Also has `captured_at` timestamp when captured
        - Note: `captured` and `captured_at` were removed in newer API versions
      properties:
        object:
          type: string
          enum: [charge]
        id:
          type: string
        location:
          type: string
        livemode:
          type: boolean
        amount:
          type: integer
        currency:
          type: string
        description:
          type: string
          nullable: true
        metadata:
          type: object
        status:
          type: string
          enum: [pending, successful, failed, expired, reversed]
        authorized:
          type: boolean
        captured:
          type: boolean
        capture:
          type: boolean
        capturable:
          type: boolean
        reversible:
          type: boolean
        reversed:
          type: boolean
        refundable:
          type: boolean
        refunded:
          type: integer
        card:
          $ref: '#/components/schemas/Card'
        customer:
          type: string
          nullable: true
        ip:
          type: string
          nullable: true
        failure_code:
          type: string
          nullable: true
        failure_message:
          type: string
          nullable: true
        created:
          type: string
          format: date-time
          description: "Aegaeon uses 'created' (Deimos changed to 'created_at')"
        paid_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        offsite:
          type: string
          nullable: true
          description: Offsite payment method (internet_banking_*)
        return_uri:
          type: string
          nullable: true
        authorize_uri:
          type: string
          nullable: true

    Card:
      type: object
      properties:
        object:
          type: string
          enum: [card]
        id:
          type: string
        last_digits:
          type: string
        brand:
          type: string
          enum: [Visa, Mastercard, JCB]

    ChargeList:
      type: object
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            $ref: '#/components/schemas/Charge'
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer

    Balance:
      type: object
      description: |
        Represents the current balance of your Omise account.
        This is a READ-ONLY API - all fields are output only.

        VERSION NOTE (Aegaeon 2014-07-27):
        - Uses `available` (renamed to `transferable` in Deimos)
        - Uses `reserve_amount` (renamed to `reserve` in Deimos)
        - Does NOT have `created_at` field (added in Deimos)
      properties:
        object:
          type: string
          enum: [balance]
          description: Always "balance"
          readOnly: true
        livemode:
          type: boolean
          description: Whether this is a live mode balance
          readOnly: true
        location:
          type: string
          description: API path "/balance"
          readOnly: true
        currency:
          type: string
          description: ISO 4217 currency code (e.g., "THB")
          readOnly: true
        total:
          type: integer
          description: Total balance after fees deducted (in smallest currency unit)
          readOnly: true
        available:
          type: integer
          description: |
            Amount you can transfer to your bank account right now (in smallest currency unit).
            Renamed to "transferable" in Deimos (2019-05-29).
          readOnly: true
        reserve_amount:
          type: integer
          description: |
            Funds held back by Omise as a security buffer - not transferable (in smallest currency unit).
            Renamed to "reserve" in Deimos (2019-05-29).
          readOnly: true
        on_hold:
          type: integer
          description: Amount on hold for disputes or reviews (in smallest currency unit)
          readOnly: true

    Account:
      type: object
      description: |
        Represents your Omise account configuration (Aegaeon 2014-07-27).
        ID format: acct_..., uses created (not created_at), currencies lowercase.
      properties:
        object:
          type: string
          enum: [account]
          readOnly: true
        id:
          type: string
          readOnly: true
        livemode:
          type: boolean
          readOnly: true
        location:
          type: string
          readOnly: true
        country:
          type: string
          readOnly: true
        currency:
          type: string
          readOnly: true
        email:
          type: string
          readOnly: true
        supported_currencies:
          type: array
          items:
            type: string
          readOnly: true
        api_version:
          type: string
          readOnly: true
        webhook_uri:
          type: string
        chain_enabled:
          type: boolean
        chain_return_uri:
          type: string
        chaining_allowed:
          type: boolean
          readOnly: true
        auto_activate_recipients:
          type: boolean
          readOnly: true
        metadata_export_keys:
          type: object
        transfer_config:
          type: object
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true

    Capability:
      type: object
      description: |
        Describes available payment methods and limits (Aegaeon 2014-07-27).
        Uses payment_backends (not payment_methods), no country field.
        Authentication: Accepts both public and secret keys.
      properties:
        object:
          type: string
          enum: [capability]
          readOnly: true
        location:
          type: string
          readOnly: true
        banks:
          type: array
          items:
            type: string
          readOnly: true
        payment_backends:
          type: array
          items:
            $ref: '#/components/schemas/PaymentBackend'
          readOnly: true
        tokenization_methods:
          type: array
          items:
            type: string
          nullable: true
          readOnly: true
        limits:
          $ref: '#/components/schemas/CapabilityLimits'
        zero_interest_installments:
          type: boolean
          readOnly: true

    PaymentBackend:
      type: object
      properties:
        object:
          type: string
        name:
          type: string
        currencies:
          type: array
          items:
            type: string
        card_brands:
          type: array
          items:
            type: string
          nullable: true
        installment_terms:
          type: array
          items:
            type: integer
          nullable: true
        banks:
          type: array
          items:
            type: string

    CapabilityLimits:
      type: object
      properties:
        charge_amount:
          type: object
          properties:
            min:
              type: integer
            max:
              type: integer
        transfer_amount:
          type: object
          properties:
            min:
              type: integer
            max:
              type: integer
        installment_amount:
          type: object
          properties:
            min:
              type: integer

    UpdateAccountRequest:
      type: object
      properties:
        webhook_uri:
          type: string
        chain_enabled:
          type: boolean
        chain_return_uri:
          type: string
        metadata_export_keys:
          type: object

    Error:
      type: object
      properties:
        object:
          type: string
          enum: [error]
        code:
          type: string
        message:
          type: string

  responses:
    InvalidCharge:
      description: Invalid charge parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing_amount:
              value:
                object: error
                code: invalid_charge
                message: "amount can't be blank"

    AuthenticationFailure:
      description: Invalid or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: authentication_failure
            message: authentication failed

    NotFound:
      description: Charge not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: not_found
            message: charge was not found

    FailedCapture:
      description: Capture failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: failed_capture
            message: charge cannot be captured

    FailedReverse:
      description: Reverse failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: failed_reverse
            message: charge cannot be reversed

    # Verified Payment Failure Codes (tested via 3DS flow on 2026-10-30)
    # Error codes are NOT version-specific - same across all API versions

    FailedProcessing:
      description: General processing failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: failed_processing
            message: failed processing

    InsufficientFund:
      description: Insufficient funds
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: insufficient_fund
            message: insufficient funds in the account or the card has reached the credit limit

    InvalidAccountNumber:
      description: Invalid card number
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: invalid_account_number
            message: the account number is invalid

    PaymentRejected:
      description: Payment rejected by provider
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: payment_rejected
            message: payment rejected

    StolenOrLostCard:
      description: Card reported stolen or lost
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: stolen_or_lost_card
            message: card is stolen or lost

    FailedFraudCheck:
      description: Failed fraud check
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: failed_fraud_check
            message: failed fraud check

    BadRequest:
      description: Bad request - missing required parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: bad_request
            message: either source, card or customer parameter must be supplied

    # From official docs (https://docs.omise.co/charges-api)
    ConfirmedAmountMismatch:
      description: "Confirmed amount does not match expected amount"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Timeout:
      description: "Payment request timed out"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InvalidAccount:
      description: "Invalid account (alias for invalid_account_number)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

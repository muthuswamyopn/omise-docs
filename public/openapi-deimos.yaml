openapi: 3.0.3
info:
  title: Omise API
  version: '2019-05-29'
  description: |
    The Omise API enables you to create and manage payment transactions.

    **API Version:** Deimos (2019-05-29) - Latest

    ## What's New in Deimos
    - **Mark as Paid/Failed**: Test mode simulation endpoints
    - **3D Secure 2.0**: three_ds_info field with version and ECI
    - **Multi-capture**: Partial captures for pre-auth
    - **Merchant advice**: Processor recommendations
    - **Regional wallets**: GrabPay, ShopeePay, Boost, TouchNGo, etc.
    - **Additional error codes**: For 3DS and card validation

    ## Authentication
    Use HTTP Basic Auth with your secret key as the username and an empty password.

servers:
  - url: https://api.omise.co

security:
  - secretKey: []

tags:
  - name: Charges
    description: Create, capture, and manage payment charges
  - name: Balance
    description: Retrieve your account balance
  - name: Account
    description: Retrieve and update your account configuration
  - name: Capability
    description: Retrieve available payment methods and account limits

paths:
  /account:
    get:
      summary: Retrieve account
      description: |
        Retrieve the current account information including configuration settings,
        supported currencies, and webhook URI.

        Both test and live keys return the same account information, but the
        `livemode` field reflects which key was used.
      operationId: getAccount
      tags: [Account]
      responses:
        '200':
          description: Account information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/AuthenticationFailure'
    patch:
      summary: Update account
      description: |
        Update account configuration settings.

        Only the fields you specify will be updated; other fields remain unchanged.

        **Editable fields:**
        - `webhook_uri` - URL for event notifications
        - `chain_enabled` - Enable/disable chain integration
        - `chain_return_uri` - Redirect URL for chain transactions
        - `zero_interest_installments` - Merchant absorbs interest
        - `metadata_export_keys` - Custom metadata keys for exports
      operationId: updateAccount
      tags: [Account]
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailure'

  /balance:
    get:
      summary: Retrieve balance
      description: |
        Retrieve the current balance of your Omise account.

        This is a READ-ONLY endpoint. The balance includes:
        - **total** - Total balance after fees deducted
        - **transferable** - Amount you can transfer to your bank right now
        - **reserve** - Funds held by Omise as security buffer
        - **on_hold** - Funds held for pending disputes/reviews
      operationId: getBalance
      tags: [Balance]
      responses:
        '200':
          description: Current balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '401':
          $ref: '#/components/responses/AuthenticationFailure'

  /capability:
    get:
      summary: Retrieve capability
      description: |
        Retrieve available payment methods, limits, and features for your account.

        **Authentication:** This endpoint accepts both public keys and secret keys.
        Public key is recommended for client-side usage since it can be safely exposed.

        The response includes:
        - **payment_methods** - Available payment methods with currencies and terms
        - **banks** - Supported bank codes for transfers
        - **limits** - Transaction limits for charges, transfers, installments
        - **tokenization_methods** - Apple Pay, Google Pay support
        - **country** - Account country (Deimos only)
      operationId: getCapability
      tags: [Capability]
      security:
        - publicKey: []
        - secretKey: []
      responses:
        '200':
          description: Account capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capability'
        '401':
          $ref: '#/components/responses/AuthenticationFailure'

  /charges:
    post:
      summary: Create a charge
      description: |
        Create a new charge to collect payment from a customer.

        You can charge using:
        - A **card token** (one-time use, from Omise.js)
        - A **customer ID** (charges their default card)
        - A **source** (PromptPay, GrabPay, ShopeePay, mobile banking, etc.)
      operationId: createCharge
      tags: [Charges]
      parameters:
        - name: Idempotency-Key
          in: header
          description: Unique key to prevent duplicate charges
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateChargeRequest'
      responses:
        '200':
          description: Charge created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          $ref: '#/components/responses/InvalidCharge'
        '401':
          $ref: '#/components/responses/AuthenticationFailure'

    get:
      summary: List all charges
      operationId: listCharges
      tags: [Charges]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: order
          in: query
          schema:
            type: string
            enum: [chronological, reverse_chronological]
      responses:
        '200':
          description: List of charges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeList'

  /charges/{id}:
    get:
      summary: Retrieve a charge
      operationId: getCharge
      tags: [Charges]
      parameters:
        - $ref: '#/components/parameters/ChargeId'
      responses:
        '200':
          description: Charge details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update a charge
      operationId: updateCharge
      tags: [Charges]
      parameters:
        - $ref: '#/components/parameters/ChargeId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                metadata:
                  type: object
      responses:
        '200':
          description: Charge updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'

  /charges/{id}/capture:
    post:
      summary: Capture a charge
      description: |
        Capture a previously authorized charge.

        For **pre-authorized** charges, you can capture a partial amount.
        **New in Deimos**: Multi-capture support for pre-auth.
      operationId: captureCharge
      tags: [Charges]
      parameters:
        - $ref: '#/components/parameters/ChargeId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                capture_amount:
                  type: integer
      responses:
        '200':
          description: Charge captured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          $ref: '#/components/responses/FailedCapture'

  /charges/{id}/reverse:
    post:
      summary: Reverse a charge
      description: Reverse (void) an authorized but uncaptured charge.
      operationId: reverseCharge
      tags: [Charges]
      parameters:
        - $ref: '#/components/parameters/ChargeId'
      responses:
        '200':
          description: Charge reversed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          $ref: '#/components/responses/FailedReverse'

  /charges/{id}/expire:
    post:
      summary: Expire a charge
      description: Manually expire a pending charge.
      operationId: expireCharge
      tags: [Charges]
      parameters:
        - $ref: '#/components/parameters/ChargeId'
      responses:
        '200':
          description: Charge expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          $ref: '#/components/responses/FailedExpire'

  /charges/{id}/mark_as_paid:
    post:
      summary: Mark as paid (test mode)
      description: |
        **New in Deimos - Test Mode Only**

        Simulate a successful payment for testing purposes.
        Only works with test mode charges.
      operationId: markChargePaid
      tags: [Charges]
      parameters:
        - $ref: '#/components/parameters/ChargeId'
      responses:
        '200':
          description: Charge marked as paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          $ref: '#/components/responses/TestModeOnly'

  /charges/{id}/mark_as_failed:
    post:
      summary: Mark as failed (test mode)
      description: |
        **New in Deimos - Test Mode Only**

        Simulate a failed payment for testing purposes.
        Only works with test mode charges.
      operationId: markChargeFailed
      tags: [Charges]
      parameters:
        - $ref: '#/components/parameters/ChargeId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                failure_code:
                  type: string
                  description: Error code to simulate
                  enum: [insufficient_fund, stolen_or_lost_card, failed_processing, payment_rejected]
      responses:
        '200':
          description: Charge marked as failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          $ref: '#/components/responses/TestModeOnly'

components:
  securitySchemes:
    secretKey:
      type: http
      scheme: basic
      description: Secret key (skey_...) - use as username with empty password
    publicKey:
      type: http
      scheme: basic
      description: Public key (pkey_...) - use as username with empty password. Safe for client-side.

  parameters:
    ChargeId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^chrg_(test_)?[a-z0-9]+$

  schemas:
    # =============================================================
    # INPUT SCHEMAS (Request Body)
    # =============================================================
    CreateChargeRequest:
      type: object
      description: |
        Request body for creating a charge.
        One of card, customer, or source is required.
      required: [amount, currency]
      properties:
        # Required fields
        amount:
          type: integer
          minimum: 100
          description: Amount in smallest currency unit (e.g., satangs for THB)
        currency:
          type: string
          enum: [thb, jpy, usd, eur, gbp, sgd, myr, idr, php]
          description: ISO 4217 currency code
        # Payment method (one required)
        card:
          type: string
          description: Card token from Omise.js (one-time use)
        customer:
          type: string
          description: Customer ID to charge their default card
        source:
          description: Source ID or inline source object for alternative payments
          oneOf:
            - type: string
            - type: object
              properties:
                type:
                  type: string
                  enum: [promptpay, truemoney, rabbit_linepay, shopeepay, grabpay, boost, touch_n_go, duitnow_qr, fpx, paynow, mobile_banking_bay, mobile_banking_bbl, mobile_banking_kbank, mobile_banking_ktb, mobile_banking_scb, alipay_cn, alipay_hk, dana, gcash, kakaopay, wechat_pay, paypay, atome, installment_bay, installment_bbl, installment_kbank, installment_ktc, installment_scb, installment_first_choice]
        # Optional fields
        capture:
          type: boolean
          default: true
          description: Auto-capture after authorization (default true)
        authorization_type:
          type: string
          enum: [pre_auth, final_auth]
          description: pre_auth allows partial capture, final_auth captures full amount
        return_uri:
          type: string
          format: uri
          description: URL to redirect after authorization (required for redirect-based payments)
        description:
          type: string
          description: Charge description (helps with fraud analysis)
        metadata:
          type: object
          description: Custom key-value pairs (max 15,000 chars)
        ip:
          type: string
          description: Customer IP address (helps with fraud analysis)
        platform_fee:
          type: object
          description: Marketplace platform fee configuration
          properties:
            fixed:
              type: integer
            percentage:
              type: number
        zero_interest_installments:
          type: boolean
          description: Merchant absorbs installment interest
        expires_at:
          type: string
          format: date-time
          description: Custom expiration time (ISO 8601 UTC)
        webhook_endpoints:
          type: array
          items:
            type: string
          description: Additional webhook URLs (max 2)
        first_charge:
          type: string
          description: First charge ID for recurring payment series
        transaction_indicator:
          type: string
          enum: [MIT, CIT]
          description: Merchant-Initiated or Customer-Initiated Transaction
        recurring_reason:
          type: string
          description: Reason for credential storage (subscription, installment, etc.)
        ref_id:
          type: string
          description: Idempotency reference ID

    UpdateChargeRequest:
      type: object
      description: Only description and metadata can be updated after creation
      properties:
        description:
          type: string
        metadata:
          type: object

    CaptureChargeRequest:
      type: object
      description: Request body for capturing an authorized charge
      properties:
        capture_amount:
          type: integer
          description: Amount to capture (for partial capture with pre_auth)

    # =============================================================
    # OUTPUT SCHEMAS (Response Body)
    # To check if captured: use captured_amount > 0
    # =============================================================

    Charge:
      type: object
      description: |
        Charge object returned in API responses.
        All fields are OUTPUT-ONLY (read-only) except description and metadata which can be updated.

        HOW TO CHECK CAPTURE STATUS (Deimos):
        - Use `captured_amount > 0` to check if captured
        - The `captured` boolean field does NOT exist in Deimos (only in Aegaeon)
      properties:
        # Identifiers (output-only)
        object:
          type: string
          enum: [charge]
          readOnly: true
        id:
          type: string
          readOnly: true
        location:
          type: string
          readOnly: true
        livemode:
          type: boolean
          readOnly: true
        # Amount fields (output-only, amount/currency set at creation)
        amount:
          type: integer
          readOnly: true
        currency:
          type: string
          readOnly: true
        # Editable fields (can be updated via PATCH)
        description:
          type: string
          nullable: true
        metadata:
          type: object
        # Status fields (all output-only)
        status:
          type: string
          enum: [pending, successful, failed, expired, reversed]
          readOnly: true
        authorized:
          type: boolean
          readOnly: true
        capture:
          type: boolean
          readOnly: true
          description: Whether auto-capture was requested
        capturable:
          type: boolean
          readOnly: true
          description: Whether charge can still be captured
        reversible:
          type: boolean
          readOnly: true
        reversed:
          type: boolean
          readOnly: true
        refundable:
          type: boolean
          readOnly: true
        refunded_amount:
          type: integer
          readOnly: true
          description: "Total refunded amount (Deimos uses refunded_amount, not refunded)"
        card:
          $ref: '#/components/schemas/Card'
        customer:
          type: string
          nullable: true
        ip:
          type: string
          nullable: true
        failure_code:
          type: string
          nullable: true
        failure_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        return_uri:
          type: string
          nullable: true
        authorize_uri:
          type: string
          nullable: true
        dispute:
          $ref: '#/components/schemas/Dispute'
          nullable: true
        transaction:
          type: string
          nullable: true
        refunds:
          $ref: '#/components/schemas/RefundList'
        disputable:
          type: boolean
        voided:
          type: boolean
        expired:
          type: boolean
        source:
          $ref: '#/components/schemas/Source'
          nullable: true
        platform_fee:
          type: object
          nullable: true
        linked_account:
          type: object
          nullable: true
        zero_interest_installments:
          type: boolean
        authorization_type:
          type: string
          nullable: true
        authorized_amount:
          type: integer
        captured_amount:
          type: integer
        funding_amount:
          type: integer
        funding_currency:
          type: string
        net:
          type: integer
        fee:
          type: integer
        fee_vat:
          type: integer
        interest:
          type: integer
        interest_vat:
          type: integer
        partially_refundable:
          type: boolean
        schedule:
          type: object
          nullable: true
        link:
          type: object
          nullable: true
        statement_descriptor:
          type: string
        approval_code:
          type: string
          nullable: true
        # New in Deimos
        three_ds_info:
          type: object
          nullable: true
          description: "New in Deimos: 3D Secure authentication details"
          properties:
            three_ds_version:
              type: string
              description: "3DS version (1.0, 2.1.0, 2.2.0)"
            eci:
              type: string
              description: "Electronic Commerce Indicator"
        unmanaged_payment:
          type: object
          nullable: true
          description: "New in Deimos: Unmanaged payment details"
        transaction_fees:
          type: object
          nullable: true
          description: "New in Deimos: Detailed fee breakdown"
        multi_capture:
          type: boolean
          description: "New in Deimos: Multiple captures allowed"
        merchant_advice:
          type: string
          nullable: true
          description: "New in Deimos: Processor recommendation"
        merchant_advice_code:
          type: string
          nullable: true
          description: "New in Deimos: Advice code"
        authenticated_by:
          type: string
          nullable: true
          description: "New in Deimos: 3DS authentication method"
        authorized_at:
          type: string
          format: date-time
          nullable: true
          description: "New in Deimos: Authorization timestamp"
        reversed_at:
          type: string
          format: date-time
          nullable: true
          description: "New in Deimos: Reversal timestamp"
        expired_at:
          type: string
          format: date-time
          nullable: true
          description: "New in Deimos: Expiration timestamp"
        can_perform_void:
          type: boolean
          description: "New in Deimos: Void available"
        acquirer_reference_number:
          type: string
          nullable: true
          description: "New in Deimos: ARN"
        ref_id:
          type: string
          nullable: true
          description: "New in Deimos: Merchant reference"
        first_charge:
          type: boolean
          description: "New in Deimos: First in series"
        transaction_indicator:
          type: string
          nullable: true
          description: "New in Deimos: MIT/CIT"
        recurring_reason:
          type: string
          nullable: true
          description: "New in Deimos: Recurring reason"
        missing_3ds_fields:
          type: array
          items:
            type: string
          description: "New in Deimos: Missing 3DS fields"
        merchant_name:
          type: string
          description: "New in Deimos: Merchant name"
        merchant_uid:
          type: string
          description: "New in Deimos: Merchant UID"
        merchant_info:
          type: object
          nullable: true
          description: "New in Deimos: Merchant info"
        branch:
          type: object
          nullable: true
          description: "New in Deimos: Branch info"
        terminal:
          type: object
          nullable: true
          description: "New in Deimos: Terminal info"
        device:
          type: object
          nullable: true
          description: "New in Deimos: Device info"

    Source:
      type: object
      properties:
        object:
          type: string
          enum: [source]
        id:
          type: string
        type:
          type: string
        flow:
          type: string
          enum: [redirect, offline]
        scannable_code:
          type: object
          nullable: true

    Card:
      type: object
      properties:
        object:
          type: string
          enum: [card]
        id:
          type: string
        last_digits:
          type: string
        brand:
          type: string
        financing:
          type: string
          enum: [credit, debit]
          nullable: true

    Dispute:
      type: object
      properties:
        object:
          type: string
          enum: [dispute]
        id:
          type: string
        status:
          type: string

    RefundList:
      type: object
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            $ref: '#/components/schemas/Refund'

    Refund:
      type: object
      properties:
        object:
          type: string
          enum: [refund]
        id:
          type: string
        amount:
          type: integer

    ChargeList:
      type: object
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            $ref: '#/components/schemas/Charge'
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer

    Balance:
      type: object
      description: |
        Represents the current balance of your Omise account.
        This is a READ-ONLY API - all fields are output only.

        VERSION DIFFERENCES (Deimos 2019-05-29):
        - `transferable` (older versions use `available`)
        - `reserve` (older versions use `reserve_amount`)
        - `created_at` (not available in older versions)
      properties:
        object:
          type: string
          enum: [balance]
          description: Always "balance"
          readOnly: true
        livemode:
          type: boolean
          description: Whether this is a live mode balance
          readOnly: true
        location:
          type: string
          description: API path "/balance"
          readOnly: true
        currency:
          type: string
          description: ISO 4217 currency code (e.g., "THB")
          readOnly: true
        total:
          type: integer
          description: Total balance after fees deducted (in smallest currency unit)
          readOnly: true
        transferable:
          type: integer
          description: |
            Amount you can transfer to your bank account right now (in smallest currency unit).
            Called "available" in older API versions (Cordelia, Bestla, Aegaeon).
          readOnly: true
        reserve:
          type: integer
          description: |
            Funds held back by Omise as a security buffer - not transferable (in smallest currency unit).
            Called "reserve_amount" in older API versions.
          readOnly: true
        on_hold:
          type: integer
          description: Amount on hold for disputes or reviews (in smallest currency unit)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: |
            Timestamp when the balance record was created.
            NEW IN DEIMOS: This field is not available in older API versions.
          readOnly: true

    Account:
      type: object
      description: |
        Represents your Omise account configuration.

        VERSION DIFFERENCES (Deimos 2019-05-29):
        - ID format: `account_test_...` (older versions use `acct_...`)
        - Has `team` field (not available in older versions)
        - Has `created_at` (older versions use `created`)
        - Has `paas_enabled`, `restricted_recipient_management`
        - Currencies are UPPERCASE (older versions use lowercase)
      properties:
        object:
          type: string
          enum: [account]
          description: Always "account"
          readOnly: true
        id:
          type: string
          description: Account identifier (account_test_... in Deimos, acct_... in older versions)
          readOnly: true
        team:
          type: string
          description: Team identifier (Deimos only)
          readOnly: true
        livemode:
          type: boolean
          description: Whether this is live mode
          readOnly: true
        location:
          type: string
          description: API path "/account"
          readOnly: true
        country:
          type: string
          description: Two-letter ISO 3166 country code
          readOnly: true
        currency:
          type: string
          description: Default currency (UPPERCASE in Deimos, lowercase in older versions)
          readOnly: true
        email:
          type: string
          description: Primary email address
          readOnly: true
        supported_currencies:
          type: array
          items:
            type: string
          description: List of supported currencies
          readOnly: true
        api_version:
          type: string
          description: Current API version
          readOnly: true
        webhook_uri:
          type: string
          description: URL for event notifications
        chain_enabled:
          type: boolean
          description: Whether chain integration is enabled
        chain_return_uri:
          type: string
          description: Redirect URL for chain transactions
        chaining_allowed:
          type: boolean
          description: Whether chaining is allowed for this account
          readOnly: true
        zero_interest_installments:
          type: boolean
          description: Whether merchant absorbs installment interest
        auto_activate_recipients:
          type: boolean
          description: Whether new recipients are auto-activated
          readOnly: true
        metadata_export_keys:
          type: object
          description: Custom metadata keys for exports
        transfer_config:
          type: object
          description: Transfer configuration including limits and fees
          readOnly: true
        last_updated_api_version:
          type: string
          description: Date when API version was last updated
          readOnly: true
        restricted_recipient_management:
          type: boolean
          description: Whether recipient management is restricted (Deimos only)
          readOnly: true
        paas_enabled:
          type: boolean
          description: Whether Platform as a Service is enabled (Deimos only)
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Account creation timestamp (Deimos). Called "created" in older versions.
          readOnly: true

    Capability:
      type: object
      description: |
        Describes available payment methods, limits, and features for your account.

        **Authentication:** Accepts both public and secret keys. Public recommended for client-side.

        **VERSION DIFFERENCES (Deimos 2019-05-29):**
        - Has `country` field (not available in older versions)
        - Has `payment_methods` (older versions use `payment_backends`)

        Verified 2026-10-30 via direct API calls.
      properties:
        object:
          type: string
          enum: [capability]
          description: Always "capability"
          readOnly: true
        location:
          type: string
          description: API path "/capability"
          readOnly: true
        country:
          type: string
          description: |
            Two-letter ISO 3166 country code where account is registered.
            NEW IN DEIMOS: Not available in older API versions.
          readOnly: true
        banks:
          type: array
          items:
            type: string
          description: List of supported bank codes for transfer recipients
          readOnly: true
          example: ["bbl", "kbank", "ktb", "scb", "bay"]
        payment_methods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
          description: |
            Available payment methods with currencies, card brands, and terms.
            Called "payment_backends" in older API versions.
          readOnly: true
        tokenization_methods:
          type: array
          items:
            type: string
            enum: [googlepay, applepay]
          description: Supported tokenization methods (Google Pay, Apple Pay)
          readOnly: true
          nullable: true
        limits:
          $ref: '#/components/schemas/CapabilityLimits'
        zero_interest_installments:
          type: boolean
          description: Whether merchant absorbs installment interest costs
          readOnly: true

    PaymentMethod:
      type: object
      description: Payment method configuration from Capability API
      properties:
        object:
          type: string
          enum: [payment_method]
        name:
          type: string
          description: Payment method identifier (e.g., "card", "promptpay", "truemoney")
        currencies:
          type: array
          items:
            type: string
          description: Supported ISO 4217 currency codes
        card_brands:
          type: array
          items:
            type: string
          description: For card payments - "Visa", "MasterCard", "JCB", "American Express", "UnionPay"
          nullable: true
        installment_terms:
          type: array
          items:
            type: integer
          description: Available installment term lengths in months
          nullable: true
        loan_installment_terms:
          type: array
          items:
            type: integer
          description: Available loan installment term lengths
          nullable: true
        banks:
          type: array
          items:
            type: string
          description: Supported bank codes for bank-specific methods
        provider:
          type: string
          description: Provider identifier if applicable
          nullable: true

    CapabilityLimits:
      type: object
      description: Transaction limits (in smallest currency unit, e.g., satang for THB)
      properties:
        charge_amount:
          type: object
          properties:
            min:
              type: integer
              description: Minimum charge amount (e.g., 100 = 1 THB)
              example: 100
            max:
              type: integer
              description: Maximum charge amount (e.g., 15000000 = 150,000 THB)
              example: 15000000
        transfer_amount:
          type: object
          properties:
            min:
              type: integer
              description: Minimum transfer amount
              example: 2000
            max:
              type: integer
              description: Maximum transfer amount
              example: 200000000000
        installment_amount:
          type: object
          properties:
            min:
              type: integer
              description: Minimum amount for installment payments
              example: 200000

    UpdateAccountRequest:
      type: object
      description: Request body for updating account settings
      properties:
        webhook_uri:
          type: string
          description: URL for event notifications
        chain_enabled:
          type: boolean
          description: Whether to enable chain integration
        chain_return_uri:
          type: string
          description: Redirect URL for chain transactions
        zero_interest_installments:
          type: boolean
          description: Whether merchant absorbs installment interest
        metadata_export_keys:
          type: object
          description: Custom metadata keys for exports

    Error:
      type: object
      properties:
        object:
          type: string
          enum: [error]
        code:
          type: string
        message:
          type: string

  responses:
    InvalidCharge:
      description: Invalid charge parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    AuthenticationFailure:
      description: Invalid or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: authentication_failure
            message: authentication failed

    NotFound:
      description: Charge not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    FailedCapture:
      description: Capture failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    FailedReverse:
      description: Reverse failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    FailedExpire:
      description: Expire failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    TestModeOnly:
      description: "New in Deimos: Only available in test mode"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: invalid_charge
            message: this operation is only available in test mode

    # All failure codes
    FailedProcessing:
      description: General processing failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InsufficientFund:
      description: Insufficient funds
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InvalidAccountNumber:
      description: Invalid card number
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    PaymentRejected:
      description: Payment rejected
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    FailedFraudCheck:
      description: Failed fraud check
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InsufficientBalance:
      description: Insufficient balance
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InvalidSecurityCode:
      description: Invalid CVV/CVC
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    PaymentCancelled:
      description: Payment cancelled
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ExpiredCard:
      description: Card expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    BadRequest:
      description: "Malformed request or missing required parameters"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: bad_request
            message: either source, card or customer parameter must be supplied

    # Verified Payment Failure Codes (tested via 3DS flow on 2026-10-30)
    StolenOrLostCard:
      description: "Card reported stolen or lost"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: stolen_or_lost_card
            message: card is stolen or lost

    FailedFraudCheckVerified:
      description: "Failed fraud check"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: failed_fraud_check
            message: failed fraud check

    InsufficientFundVerified:

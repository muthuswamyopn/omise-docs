openapi: 3.0.3
info:
  title: Omise API
  version: '2015-11-17'
  description: |
    The Omise API enables you to create and manage payment transactions.

    **API Version:** Bestla (2015-11-17)

    ## What's New in Bestla
    - Dispute management
    - Refund tracking on charges
    - Internet banking (Alipay, K-Bank)
    - Additional failure codes

    ## Authentication
    Use HTTP Basic Auth with your secret key as the username and an empty password.

servers:
  - url: https://api.omise.co

security:
  - secretKey: []

tags:
  - name: Charges
    description: Create, capture, and manage payment charges

paths:
  /charges:
    post:
      summary: Create a charge
      description: |
        Create a new charge to collect payment from a customer.

        You can charge using:
        - A **card token** (one-time use, from Omise.js)
        - A **customer ID** (charges their default card)
        - An **offsite** payment method (internet banking, Alipay)
      operationId: createCharge
      tags: [Charges]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateChargeRequest'
      responses:
        '200':
          description: Charge created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          $ref: '#/components/responses/InvalidCharge'
        '401':
          $ref: '#/components/responses/AuthenticationFailure'

    get:
      summary: List all charges
      operationId: listCharges
      tags: [Charges]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of charges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeList'

  /charges/{id}:
    get:
      summary: Retrieve a charge
      operationId: getCharge
      tags: [Charges]
      parameters:
        - $ref: '#/components/parameters/ChargeId'
      responses:
        '200':
          description: Charge details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update a charge
      operationId: updateCharge
      tags: [Charges]
      parameters:
        - $ref: '#/components/parameters/ChargeId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                metadata:
                  type: object
      responses:
        '200':
          description: Charge updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'

  /charges/{id}/capture:
    post:
      summary: Capture a charge
      description: Capture a previously authorized charge.
      operationId: captureCharge
      tags: [Charges]
      parameters:
        - $ref: '#/components/parameters/ChargeId'
      responses:
        '200':
          description: Charge captured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          $ref: '#/components/responses/FailedCapture'

  /charges/{id}/reverse:
    post:
      summary: Reverse a charge
      description: Reverse (void) an authorized but uncaptured charge.
      operationId: reverseCharge
      tags: [Charges]
      parameters:
        - $ref: '#/components/parameters/ChargeId'
      responses:
        '200':
          description: Charge reversed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          $ref: '#/components/responses/FailedReverse'

components:
  securitySchemes:
    secretKey:
      type: http
      scheme: basic

  parameters:
    ChargeId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^chrg_(test_)?[a-z0-9]+$

  schemas:
    CreateChargeRequest:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          minimum: 1
        currency:
          type: string
          enum: [thb, jpy, usd, eur, gbp, sgd]
        card:
          type: string
        customer:
          type: string
        offsite:
          type: string
          enum: [internet_banking_bay, internet_banking_bbl, internet_banking_ktb, internet_banking_scb, internet_banking_kbank, alipay]
          description: "Added in Bestla: Alipay and K-Bank internet banking"
        capture:
          type: boolean
          default: true
        return_uri:
          type: string
          format: uri
        description:
          type: string
        metadata:
          type: object
        ip:
          type: string

    Charge:
      type: object
      properties:
        object:
          type: string
          enum: [charge]
        id:
          type: string
        location:
          type: string
        livemode:
          type: boolean
        amount:
          type: integer
        currency:
          type: string
        description:
          type: string
          nullable: true
        metadata:
          type: object
        status:
          type: string
          enum: [pending, successful, failed, expired, reversed]
        authorized:
          type: boolean
        captured:
          type: boolean
        capture:
          type: boolean
        capturable:
          type: boolean
        reversible:
          type: boolean
        reversed:
          type: boolean
        refundable:
          type: boolean
        refunded:
          type: integer
        card:
          $ref: '#/components/schemas/Card'
        customer:
          type: string
          nullable: true
        ip:
          type: string
          nullable: true
        failure_code:
          type: string
          nullable: true
        failure_message:
          type: string
          nullable: true
        created:
          type: string
          format: date-time
          description: "Bestla uses 'created' (Deimos changed to 'created_at')"
        paid_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        offsite:
          type: string
          nullable: true
        return_uri:
          type: string
          nullable: true
        authorize_uri:
          type: string
          nullable: true
        # New in Bestla
        dispute:
          $ref: '#/components/schemas/Dispute'
          nullable: true
          description: "New in Bestla: Associated dispute if any"
        transaction:
          type: string
          nullable: true
          description: "New in Bestla: Transaction ID"
        refunds:
          $ref: '#/components/schemas/RefundList'
          description: "New in Bestla: List of refunds"
        source_of_fund:
          type: string
          enum: [card, offsite, offline]
          description: "New in Bestla: Source type"
        disputable:
          type: boolean
          description: "New in Bestla: Whether dispute can be created"
        voided:
          type: boolean
          description: "New in Bestla: Whether charge has been voided"
        expired:
          type: boolean
          description: "New in Bestla: Whether charge has expired"

    Card:
      type: object
      properties:
        object:
          type: string
          enum: [card]
        id:
          type: string
        last_digits:
          type: string
        brand:
          type: string
          enum: [Visa, Mastercard, JCB]

    Dispute:
      type: object
      description: "New in Bestla"
      properties:
        object:
          type: string
          enum: [dispute]
        id:
          type: string
        status:
          type: string
          enum: [open, pending, won, lost]

    RefundList:
      type: object
      description: "New in Bestla"
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            $ref: '#/components/schemas/Refund'

    Refund:
      type: object
      description: "New in Bestla"
      properties:
        object:
          type: string
          enum: [refund]
        id:
          type: string
        amount:
          type: integer
        currency:
          type: string

    ChargeList:
      type: object
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            $ref: '#/components/schemas/Charge'
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer

    Error:
      type: object
      properties:
        object:
          type: string
          enum: [error]
        code:
          type: string
        message:
          type: string

  responses:
    InvalidCharge:
      description: Invalid charge parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    AuthenticationFailure:
      description: Invalid or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: authentication_failure
            message: authentication failed

    NotFound:
      description: Charge not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: not_found
            message: charge was not found

    FailedCapture:
      description: Capture failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: failed_capture
            message: charge cannot be captured

    FailedReverse:
      description: Reverse failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: failed_reverse
            message: charge cannot be reversed

    # Verified Payment Failure Codes (tested via 3DS flow on 2026-10-30)
    # Error codes are NOT version-specific - same across all API versions
    FailedProcessing:
      description: General processing failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: failed_processing
            message: failed processing

    InsufficientFund:
      description: Insufficient funds
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: insufficient_fund
            message: insufficient funds in the account or the card has reached the credit limit

    InvalidAccountNumber:
      description: Invalid card number
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: invalid_account_number
            message: the account number is invalid

    PaymentRejected:
      description: Payment rejected
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: payment_rejected
            message: payment rejected

    StolenOrLostCard:
      description: Card reported stolen or lost
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: stolen_or_lost_card
            message: card is stolen or lost

    FailedFraudCheck:
      description: Failed fraud check
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: failed_fraud_check
            message: failed fraud check

    BadRequest:
      description: Bad request - missing required parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: bad_request
            message: either source, card or customer parameter must be supplied

    # NOTE: The following error codes are NOT verified / do not exist as documented:
    # - invalid_security_code: Test card returns successful charge
    # - expired_card: Test card returns payment_rejected instead
    # - insufficient_balance: Unverified
    # - payment_cancelled: Unverified

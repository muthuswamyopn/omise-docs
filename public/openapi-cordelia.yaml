openapi: 3.0.3
info:
  title: Omise API
  version: '2017-11-02'
  description: |
    The Omise API enables you to create and manage payment transactions.

    **API Version:** Cordelia (2017-11-02)

    ## What's New in Cordelia
    - **Expire endpoint**: Manually expire pending charges
    - **Source object**: Replaces offsite for alternative payments
    - **Platform fees**: Marketplace/Connect support
    - **Zero interest installments**: Merchant-absorbed interest
    - **PromptPay & TrueMoney**: New payment methods
    - **Fee breakdown**: net, fee, fee_vat fields

    ## Authentication
    Use HTTP Basic Auth with your secret key as the username and an empty password.

servers:
  - url: https://api.omise.co

security:
  - secretKey: []

tags:
  - name: Charges
    description: Create, capture, and manage payment charges
  - name: Balance
    description: Retrieve your account balance
  - name: Account
    description: Retrieve and update your account configuration
  - name: Capability
    description: Retrieve available payment methods and account limits

paths:
  /account:
    get:
      summary: Retrieve account
      description: |
        Retrieve the current account information.

        NOTE: In Deimos (2019-05-29), the ID format changed from `acct_...` to `account_test_...`,
        `created` was renamed to `created_at`, and currencies are UPPERCASE.
      operationId: getAccount
      tags: [Account]
      responses:
        '200':
          description: Account information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/AuthenticationFailure'
    patch:
      summary: Update account
      description: |
        Update account configuration settings.

        **Editable fields:** webhook_uri, chain_enabled, chain_return_uri,
        zero_interest_installments, metadata_export_keys
      operationId: updateAccount
      tags: [Account]
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailure'

  /balance:
    get:
      summary: Retrieve balance
      description: |
        Retrieve the current balance of your Omise account.

        This is a READ-ONLY endpoint. The balance includes:
        - **total** - Total balance after fees deducted
        - **available** - Amount you can transfer to your bank right now
        - **reserve_amount** - Funds held by Omise as security buffer
        - **on_hold** - Funds held for pending disputes/reviews

        NOTE: In newer API versions (Deimos), `available` is renamed to `transferable`
        and `reserve_amount` is renamed to `reserve`.
      operationId: getBalance
      tags: [Balance]
      responses:
        '200':
          description: Current balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '401':
          $ref: '#/components/responses/AuthenticationFailure'

  /capability:
    get:
      summary: Retrieve capability
      description: |
        Retrieve available payment methods, limits, and features for your account.

        **Authentication:** Accepts both public keys (pkey_...) and secret keys (skey_...).
        Public key is recommended for client-side usage.

        **Note:** This version uses `payment_backends` instead of `payment_methods`
        and does not include the `country` field. See Deimos for newer format.
      operationId: getCapability
      tags: [Capability]
      security:
        - publicKey: []
        - secretKey: []
      responses:
        '200':
          description: Account capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capability'
        '401':
          $ref: '#/components/responses/AuthenticationFailure'

  /charges:
    post:
      summary: Create a charge
      description: |
        Create a new charge to collect payment from a customer.

        You can charge using:
        - A **card token** (one-time use, from Omise.js)
        - A **customer ID** (charges their default card)
        - A **source** (PromptPay, TrueMoney, installments, mobile banking)
      operationId: createCharge
      tags: [Charges]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateChargeRequest'
      responses:
        '200':
          description: Charge created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          $ref: '#/components/responses/InvalidCharge'
        '401':
          $ref: '#/components/responses/AuthenticationFailure'

    get:
      summary: List all charges
      operationId: listCharges
      tags: [Charges]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of charges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeList'

  /charges/{id}:
    get:
      summary: Retrieve a charge
      operationId: getCharge
      tags: [Charges]
      parameters:
        - $ref: '#/components/parameters/ChargeId'
      responses:
        '200':
          description: Charge details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update a charge
      operationId: updateCharge
      tags: [Charges]
      parameters:
        - $ref: '#/components/parameters/ChargeId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                metadata:
                  type: object
      responses:
        '200':
          description: Charge updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'

  /charges/{id}/capture:
    post:
      summary: Capture a charge
      description: |
        Capture a previously authorized charge.

        For **pre-authorized** charges, you can capture a partial amount.
      operationId: captureCharge
      tags: [Charges]
      parameters:
        - $ref: '#/components/parameters/ChargeId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                capture_amount:
                  type: integer
                  description: "New in Cordelia: Amount to capture (partial capture)"
      responses:
        '200':
          description: Charge captured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          $ref: '#/components/responses/FailedCapture'

  /charges/{id}/reverse:
    post:
      summary: Reverse a charge
      description: Reverse (void) an authorized but uncaptured charge.
      operationId: reverseCharge
      tags: [Charges]
      parameters:
        - $ref: '#/components/parameters/ChargeId'
      responses:
        '200':
          description: Charge reversed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          $ref: '#/components/responses/FailedReverse'

  /charges/{id}/expire:
    post:
      summary: Expire a charge
      description: |
        **New in Cordelia**

        Manually expire a pending charge. Use when a customer abandons a payment flow.
      operationId: expireCharge
      tags: [Charges]
      parameters:
        - $ref: '#/components/parameters/ChargeId'
      responses:
        '200':
          description: Charge expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          $ref: '#/components/responses/FailedExpire'

components:
  securitySchemes:
    secretKey:
      type: http
      scheme: basic
      description: Secret key (skey_...) - use as username with empty password
    publicKey:
      type: http
      scheme: basic
      description: Public key (pkey_...) - use as username with empty password. Safe for client-side.

  parameters:
    ChargeId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^chrg_(test_)?[a-z0-9]+$

  schemas:
    CreateChargeRequest:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          minimum: 1
        currency:
          type: string
          enum: [thb, jpy, usd, eur, gbp, sgd]
        card:
          type: string
        customer:
          type: string
        source:
          oneOf:
            - type: string
              description: Source ID
            - type: object
              properties:
                type:
                  type: string
                  enum: [promptpay, truemoney, installment_bay, installment_bbl, installment_kbank, installment_ktc, installment_scb, installment_first_choice]
          description: "New in Cordelia: Source for alternative payments"
        capture:
          type: boolean
          default: true
        authorization_type:
          type: string
          enum: [pre_auth, final_auth]
          description: "New in Cordelia: pre_auth allows partial capture"
        return_uri:
          type: string
          format: uri
        description:
          type: string
        metadata:
          type: object
        ip:
          type: string
        platform_fee:
          type: object
          description: "New in Cordelia: Marketplace platform fee"
          properties:
            fixed:
              type: integer
            percentage:
              type: number
        zero_interest_installments:
          type: boolean
          description: "New in Cordelia: Merchant absorbs interest"
        expires_at:
          type: string
          format: date-time
          description: "New in Cordelia: Custom expiration"
        webhook_endpoints:
          type: array
          items:
            type: string
          description: "New in Cordelia: Additional webhooks"

    Charge:
      type: object
      description: |
        Charge object returned in API responses.

        HOW TO CHECK CAPTURE STATUS (Cordelia):
        - Use `captured_amount > 0` to check if captured
        - The `captured` boolean field does NOT exist in Cordelia (only in Aegaeon)
      properties:
        object:
          type: string
          enum: [charge]
        id:
          type: string
        location:
          type: string
        livemode:
          type: boolean
        amount:
          type: integer
        currency:
          type: string
        description:
          type: string
          nullable: true
        metadata:
          type: object
        status:
          type: string
          enum: [pending, successful, failed, expired, reversed]
        authorized:
          type: boolean
        capture:
          type: boolean
        capturable:
          type: boolean
        reversible:
          type: boolean
        reversed:
          type: boolean
        refundable:
          type: boolean
        refunded:
          type: integer
        card:
          $ref: '#/components/schemas/Card'
        customer:
          type: string
          nullable: true
        ip:
          type: string
          nullable: true
        failure_code:
          type: string
          nullable: true
        failure_message:
          type: string
          nullable: true
        created:
          type: string
          format: date-time
          description: "Cordelia uses 'created' (Deimos changed to 'created_at')"
        paid_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        return_uri:
          type: string
          nullable: true
        authorize_uri:
          type: string
          nullable: true
        dispute:
          $ref: '#/components/schemas/Dispute'
          nullable: true
        transaction:
          type: string
          nullable: true
        refunds:
          $ref: '#/components/schemas/RefundList'
        disputable:
          type: boolean
        voided:
          type: boolean
        expired:
          type: boolean
        # New in Cordelia
        source:
          $ref: '#/components/schemas/Source'
          nullable: true
          description: "New in Cordelia: Payment source details"
        platform_fee:
          type: object
          nullable: true
          description: "New in Cordelia: Platform fee config"
          properties:
            fixed:
              type: integer
            amount:
              type: integer
            percentage:
              type: string
        linked_account:
          type: object
          nullable: true
          description: "New in Cordelia: Linked account for marketplace"
        zero_interest_installments:
          type: boolean
          description: "New in Cordelia: Merchant absorbs interest"
        authorization_type:
          type: string
          nullable: true
          description: "New in Cordelia: pre_auth or final_auth"
        authorized_amount:
          type: integer
          description: "New in Cordelia: Amount authorized"
        captured_amount:
          type: integer
          description: "New in Cordelia: Amount captured"
        funding_amount:
          type: integer
          description: "New in Cordelia: Amount in funding currency"
        funding_currency:
          type: string
          description: "New in Cordelia: Settlement currency"
        partially_refundable:
          type: boolean
          description: "New in Cordelia: Partial refund allowed"
        schedule:
          type: object
          nullable: true
          description: "New in Cordelia: Associated schedule"
        link:
          type: object
          nullable: true
          description: "New in Cordelia: Payment link"
        statement_descriptor:
          type: string
          description: "New in Cordelia: Statement descriptor"
        approval_code:
          type: string
          nullable: true
          description: "New in Cordelia: Authorization code"

    Source:
      type: object
      description: "New in Cordelia"
      properties:
        object:
          type: string
          enum: [source]
        id:
          type: string
        type:
          type: string
          enum: [promptpay, truemoney, installment_bay, installment_bbl, installment_kbank, installment_ktc, installment_scb, installment_first_choice]
        flow:
          type: string
          enum: [redirect, offline]
        scannable_code:
          type: object
          nullable: true

    Card:
      type: object
      properties:
        object:
          type: string
          enum: [card]
        id:
          type: string
        last_digits:
          type: string
        brand:
          type: string

    Dispute:
      type: object
      properties:
        object:
          type: string
          enum: [dispute]
        id:
          type: string
        status:
          type: string

    RefundList:
      type: object
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            $ref: '#/components/schemas/Refund'

    Refund:
      type: object
      properties:
        object:
          type: string
          enum: [refund]
        id:
          type: string
        amount:
          type: integer

    ChargeList:
      type: object
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            $ref: '#/components/schemas/Charge'
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer

    Balance:
      type: object
      description: |
        Represents the current balance of your Omise account.
        This is a READ-ONLY API - all fields are output only.

        VERSION NOTE (Cordelia 2017-11-02):
        - Uses `available` (renamed to `transferable` in Deimos)
        - Uses `reserve_amount` (renamed to `reserve` in Deimos)
        - Does NOT have `created_at` field (added in Deimos)
      properties:
        object:
          type: string
          enum: [balance]
          description: Always "balance"
          readOnly: true
        livemode:
          type: boolean
          description: Whether this is a live mode balance
          readOnly: true
        location:
          type: string
          description: API path "/balance"
          readOnly: true
        currency:
          type: string
          description: ISO 4217 currency code (e.g., "THB")
          readOnly: true
        total:
          type: integer
          description: Total balance after fees deducted (in smallest currency unit)
          readOnly: true
        available:
          type: integer
          description: |
            Amount you can transfer to your bank account right now (in smallest currency unit).
            Renamed to "transferable" in Deimos (2019-05-29).
          readOnly: true
        reserve_amount:
          type: integer
          description: |
            Funds held back by Omise as a security buffer - not transferable (in smallest currency unit).
            Renamed to "reserve" in Deimos (2019-05-29).
          readOnly: true
        on_hold:
          type: integer
          description: Amount on hold for disputes or reviews (in smallest currency unit)
          readOnly: true

    Account:
      type: object
      description: |
        Represents your Omise account configuration.

        VERSION NOTE (Cordelia 2017-11-02):
        - ID format: `acct_...` (Deimos uses `account_test_...`)
        - Uses `created` (Deimos uses `created_at`)
        - Currencies are lowercase (Deimos uses UPPERCASE)
        - No `team`, `paas_enabled`, `restricted_recipient_management` fields
      properties:
        object:
          type: string
          enum: [account]
          readOnly: true
        id:
          type: string
          description: Account identifier (acct_...)
          readOnly: true
        livemode:
          type: boolean
          readOnly: true
        location:
          type: string
          readOnly: true
        country:
          type: string
          readOnly: true
        currency:
          type: string
          description: Default currency (lowercase in this version)
          readOnly: true
        email:
          type: string
          readOnly: true
        supported_currencies:
          type: array
          items:
            type: string
          readOnly: true
        api_version:
          type: string
          readOnly: true
        webhook_uri:
          type: string
        chain_enabled:
          type: boolean
        chain_return_uri:
          type: string
        chaining_allowed:
          type: boolean
          readOnly: true
        zero_interest_installments:
          type: boolean
        auto_activate_recipients:
          type: boolean
          readOnly: true
        metadata_export_keys:
          type: object
        transfer_config:
          type: object
          readOnly: true
        last_updated_api_version:
          type: string
          readOnly: true
        created:
          type: string
          format: date-time
          description: Account creation timestamp (renamed to created_at in Deimos)
          readOnly: true

    Capability:
      type: object
      description: |
        Describes available payment methods, limits, and features for your account.

        **Authentication:** Accepts both public and secret keys. Public recommended for client-side.

        **VERSION NOTE (Cordelia):**
        - Uses `payment_backends` (Deimos uses `payment_methods`)
        - No `country` field (added in Deimos)

        Verified 2026-10-30 via direct API calls.
      properties:
        object:
          type: string
          enum: [capability]
          description: Always "capability"
          readOnly: true
        location:
          type: string
          description: API path "/capability"
          readOnly: true
        banks:
          type: array
          items:
            type: string
          description: List of supported bank codes for transfer recipients
          readOnly: true
        payment_backends:
          type: array
          items:
            $ref: '#/components/schemas/PaymentBackend'
          description: |
            Available payment backends with currencies and terms.
            Renamed to "payment_methods" in Deimos.
          readOnly: true
        tokenization_methods:
          type: array
          items:
            type: string
            enum: [googlepay, applepay]
          description: Supported tokenization methods
          readOnly: true
          nullable: true
        limits:
          $ref: '#/components/schemas/CapabilityLimits'
        zero_interest_installments:
          type: boolean
          description: Whether merchant absorbs installment interest costs
          readOnly: true

    PaymentBackend:
      type: object
      description: Payment backend configuration (renamed to PaymentMethod in Deimos)
      properties:
        object:
          type: string
          enum: [payment_backend]
        name:
          type: string
          description: Payment method identifier (e.g., "card", "promptpay")
        currencies:
          type: array
          items:
            type: string
          description: Supported currency codes
        card_brands:
          type: array
          items:
            type: string
          nullable: true
        installment_terms:
          type: array
          items:
            type: integer
          nullable: true
        banks:
          type: array
          items:
            type: string

    CapabilityLimits:
      type: object
      description: Transaction limits (in smallest currency unit)
      properties:
        charge_amount:
          type: object
          properties:
            min:
              type: integer
            max:
              type: integer
        transfer_amount:
          type: object
          properties:
            min:
              type: integer
            max:
              type: integer
        installment_amount:
          type: object
          properties:
            min:
              type: integer

    UpdateAccountRequest:
      type: object
      properties:
        webhook_uri:
          type: string
        chain_enabled:
          type: boolean
        chain_return_uri:
          type: string
        zero_interest_installments:
          type: boolean
        metadata_export_keys:
          type: object

    Error:
      type: object
      properties:
        object:
          type: string
          enum: [error]
        code:
          type: string
        message:
          type: string

  responses:
    InvalidCharge:
      description: Invalid charge parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    AuthenticationFailure:
      description: Invalid or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: authentication_failure
            message: authentication failed

    NotFound:
      description: Charge not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    FailedCapture:
      description: Capture failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: failed_capture
            message: charge cannot be captured

    FailedReverse:
      description: Reverse failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: failed_reverse
            message: charge cannot be reversed

    FailedExpire:
      description: "New in Cordelia: Expire failed"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: failed_expire
            message: charge cannot be expired

    # Verified Payment Failure Codes (tested via 3DS flow on 2026-10-30)
    # Error codes are NOT version-specific - same across all API versions
    FailedProcessing:
      description: General processing failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: failed_processing
            message: failed processing

    InsufficientFund:
      description: Insufficient funds
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: insufficient_fund
            message: insufficient funds in the account or the card has reached the credit limit

    InvalidAccountNumber:
      description: Invalid card number
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: invalid_account_number
            message: the account number is invalid

    PaymentRejected:
      description: Payment rejected
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: payment_rejected
            message: payment rejected

    StolenOrLostCard:
      description: Card reported stolen or lost
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: stolen_or_lost_card
            message: card is stolen or lost

    FailedFraudCheck:
      description: Failed fraud check
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: failed_fraud_check
            message: failed fraud check

    BadRequest:
      description: Bad request - missing required parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            object: error
            code: bad_request
            message: either source, card or customer parameter must be supplied

    # From official docs (https://docs.omise.co/charges-api)
    ConfirmedAmountMismatch:
      description: "Confirmed amount does not match expected amount"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Timeout:
      description: "Payment request timed out"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InvalidAccount:
      description: "Invalid account (alias for invalid_account_number)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    # NOTE: Some error codes could not be verified via test cards
